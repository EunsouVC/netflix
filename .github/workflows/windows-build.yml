name: Gerar instaladores Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Instalar Tauri CLI 2
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2" --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validar formatação Rust
        shell: pwsh
        run: |
          rustfmt --check main.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validar tipos e navegação
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar EXE e MSI
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Bundle all
      - name: Disponibilizar instaladores e Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: lume-netflix-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
