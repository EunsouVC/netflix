[package]
name = "lume-netflix"
version = "0.1.0"
description = "Cliente experimental da Netflix em uma janela WebView2"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"
autobins = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-single-instance = "2"

[[bin]]
name = "lume-netflix"
path = "../main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
